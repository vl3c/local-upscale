name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs without a GPU, weights, the SeedVR2 checkout or local-image: the tests cover the size
  # arithmetic, tiling, face mixing, print cropping, the CLI and the repo safety check.
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pytest -q
      - run: python scripts/check_repo_safe.py
